# TEMPORARY: runs the nightly's E2E job on pushes to this branch only. Deleted before the pull request merges.
name: e2e-probe
on:
  push:
    branches: [nh-ci-env]
permissions: {}
env:
  CARGO_TERM_COLOR: always
jobs:
  e2e-full:
    # Builds the app with the test endpoints and runs every E2E spec on Windows, where the real window lives.
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-e2e
      - name: Install tools
        run: npm ci
      - name: Test build of the app
        run: npx tauri build --no-bundle --features test-endpoints -- --profile ci
      - name: msedgedriver matching the WebView2 Runtime
        run: pwsh tests/e2e/scripts/edgedriver.ps1
      - name: tauri-driver
        run: pwsh tests/e2e/scripts/tauri-driver.ps1
      - name: Every E2E spec
        env:
          OPENNOTE_E2E_EXE: target/ci/opennote.exe
          # Each spec keeps a screenshot and the page text of its last moment, with the app's logs (tests/e2e/harness.ts).
          OPENNOTE_E2E_DIAG: '1'
        # One file at a time, because the specs share the machine's windows (tests/e2e/harness.ts). The specs in
        # tests/e2e/later cover Phases 6 to 13: export a PDF, import a notebook, record then stop, search, back up
        # now, quick capture, and the tool windows.
        # The timeout is for a whole file: the crash spec starts the app 50 times and takes about nine minutes.
        # Each spec file runs in a process of its own, and any app or driver it left behind is stopped before the
        # next one starts, so one spec that dies cannot reset the connections of the 70 after it.
        run: |
          $failed = @()
          foreach ($spec in Get-ChildItem tests/e2e -Recurse -Filter '*.spec.ts' | Sort-Object FullName) {
            node --test --test-concurrency=1 --test-timeout=1800000 $spec.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $spec.Name }
            Get-Process -Name opennote, msedgedriver, tauri-driver -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if ($failed.Count -gt 0) {
            "Failed specs: $($failed -join ', ')" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
      - name: Keep the E2E logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-e2e-logs
          path: tests/e2e/logs
          if-no-files-found: ignore
          retention-days: 3


  nvda:
    # NVDA, driven by Guidepup, walks through the checklist for the keyboard and the screen reader in tests/nvda in a headed browser and
    # records what it said (A4-42). The Guidepup packages are installed here from the lock file in tests/nvda, not from package.json, so no other job
    # needs them. A phrase NVDA did not say fails the job, and nvda.json has everything it did say.
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      - name: Install Guidepup
        # From the lock file in tests/nvda, which is a package of its own, away from the repository's tree: installing on
        # top of it failed with "Cannot read properties of null (reading 'edgesOut')". The spec finds the package from
        # there. No install scripts run, and the optional recorder (with its ffmpeg download) is left out.
        run: npm ci --prefix tests/nvda --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Set up the machine for NVDA
        # Guidepup 0.35 and later keep the machine setup and the screen reader download apart: "setup" prepares Windows
        # (registry and speech settings), and "install" downloads the NVDA build in the Guidepup manifest, checks its
        # checksum, and unpacks it into the cache where Guidepup looks. Without "install", NVDA is not installed and
        # the first call to nvda.start() fails. Run from tests/nvda so that "install" finds its Guidepup package.
        working-directory: tests/nvda
        run: |
          npx --no-install guidepup setup --ci
          npx --no-install guidepup install nvda
      - name: Walk the checklist with NVDA
        env:
          OPENNOTE_NVDA: '1'
        run: npm run nvda
      - name: Show the results
        if: always()
        shell: bash
        run: '[ -f tests/nvda/results/nvda.md ] && cat tests/nvda/results/nvda.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-nvda-results
          path: tests/nvda/results/nvda.*
          if-no-files-found: ignore
          retention-days: 3
