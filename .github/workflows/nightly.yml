name: nightly

# The long-running hardening tests of DEVELOPMENT.md section 8: fuzzing, the kill harness, property tests with
# many cases, the performance budgets, a two-hour random-editing soak, and an NVDA run of the keyboard and screen
# reader checklist. The e2e-full job runs every E2E spec in the full app on Windows. It is the Phase 3 skeleton,
# which later phases grow with other architectures, 200% text, start-up baselines, and the frame probe. The bundles
# job builds the macOS dmg and the Linux AppImage.
#
# The jobs run every night on the default branch and on demand. A failure opens an issue, or adds a comment to the
# one that is already open. See docs/HARDENING.md.
#
# Like release.yml, every job gets only the permissions it needs, nothing persists git credentials, and the
# actions are pinned to full commit SHAs. No job uses a secret. Only the last job can write, and it can write
# issues only.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: Minutes to fuzz each target
        type: number
        default: 30
      kills:
        description: Kills in the crash-safety test
        type: number
        default: 1000
      proptest_cases:
        description: Cases for each property test
        type: number
        default: 10000
      pages:
        description: Pages in the performance notebook
        type: number
        default: 1000
      soak_minutes:
        description: Minutes of random editing in the soak
        type: number
        default: 120

permissions: {}

# Two nightly runs never overlap, so the fuzz corpus cache is never written by two runs at once.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    # One fuzz job per target, read from the fuzz_targets folder so a new target is never forgotten.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: List the fuzz targets
        id: targets
        run: |
          # Each entry names the crate and the target: the core formats, and the importers and search indexer.
          targets=$(for crate in crates/core crates/interop; do
            for file in "$crate"/fuzz/fuzz_targets/*.rs; do
              jq -nc --arg crate "$crate" --arg name "$(basename -s .rs "$file")" '{crate: $crate, name: $name}'
            done
          done | jq -sc .)
          if [ "$targets" = "[]" ]; then
            echo "::error::No fuzz targets found in crates/core/fuzz or crates/interop/fuzz."
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    # Runs each cargo-fuzz target for the same time, in parallel. The corpus is kept between nights in the
    # Actions cache, so each night starts where the last one ended.
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      FUZZ_TARGET: ${{ matrix.target.name }}
      FUZZ_MINUTES: ${{ inputs.fuzz_minutes || '30' }}
      FUZZ_CRATE: ${{ matrix.target.crate }}
      FUZZ_DIR: ${{ github.workspace }}/${{ matrix.target.crate }}/fuzz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.target.crate }}/fuzz
          shared-key: nightly-fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Restore the corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.target.crate }}/fuzz/corpus/${{ matrix.target.name }}
          key: fuzz-corpus-${{ matrix.target.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target.name }}-
      - name: Fuzz ${{ matrix.target.crate }} ${{ matrix.target.name }}
        run: |
          if ! [[ "$FUZZ_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::fuzz_minutes must be a whole number."
            exit 1
          fi
          mkdir -p "$FUZZ_DIR/corpus/$FUZZ_TARGET" "$FUZZ_DIR/regressions/$FUZZ_TARGET"
          cd "$FUZZ_CRATE"
          # The first folder collects new inputs. The second holds the crashes fixed in the past, as seeds.
          cargo fuzz run "$FUZZ_TARGET" \
            "$FUZZ_DIR/corpus/$FUZZ_TARGET" "$FUZZ_DIR/regressions/$FUZZ_TARGET" \
            -- -max_total_time=$((FUZZ_MINUTES * 60)) -rss_limit_mb=2048
      - name: Keep the corpus, even when the run found a crash
        if: ${{ always() && steps.corpus.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.target.crate }}/fuzz/corpus/${{ matrix.target.name }}
          key: fuzz-corpus-${{ matrix.target.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target.name }}
          path: ${{ matrix.target.crate }}/fuzz/artifacts/${{ matrix.target.name }}
          if-no-files-found: ignore
          retention-days: 30

  kill:
    # Kills a writer during saves and checks that no page is damaged or lost (DEVELOPMENT.md section 6).
    # The seed is the run number, so a failure can be replayed with the same seed.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      KILLS: ${{ inputs.kills || '1000' }}
      KILL_NOTEBOOK: ${{ github.workspace }}/kill-notebook
      # Optimized code runs more saves in the same time than debug code, and keeps debug assertions.
      CARGO_PROFILE_DEV_OPT_LEVEL: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-kill
      - name: Build the kill harness
        run: cargo build -p opennote-crashtest
      - name: Kill the writer ${{ inputs.kills || '1000' }} times
        run: |
          mkdir -p "$KILL_NOTEBOOK"
          echo "Seed: $GITHUB_RUN_ID"
          target/debug/opennote-crashtest run --notebook "$KILL_NOTEBOOK" --iterations "$KILLS" --seed "$GITHUB_RUN_ID"
      - name: Keep the notebook the harness checked
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kill-notebook
          path: kill-notebook
          if-no-files-found: ignore
          retention-days: 30

  proptest:
    # The core tests with far more random cases than a pull request runs.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PROPTEST_CASES: ${{ inputs.proptest_cases || '10000' }}
      CARGO_PROFILE_DEV_OPT_LEVEL: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-proptest
      - name: Core tests with ${{ inputs.proptest_cases || '10000' }} cases for each property
        run: cargo test -p opennote-core --all-features
      - name: Keep the failing cases
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proptest-regressions
          path: crates/core/**/proptest-regressions
          if-no-files-found: ignore
          retention-days: 30

  perf:
    # The full benchmarks with their budget check. A run on a hosted runner catches large regressions. The
    # budgets of BRAND.md section 10 still count only on the reference laptop.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PAGES: ${{ inputs.pages || '1000' }}
      PERF_DIR: ${{ github.workspace }}/perf-scratch
      PERF_RESULTS: ${{ github.workspace }}/perf.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-perf
      - name: Build the benchmarks
        run: cargo build --release -p opennote-perf
      - name: Run every suite and check the budgets
        run: |
          mkdir -p "$PERF_DIR"
          target/release/opennote-perf bench all --pages "$PAGES" --machine github-ubuntu-latest \
            --out "$PERF_RESULTS" "$PERF_DIR"
      - name: Show the results
        if: always()
        run: |
          [ -f "$PERF_RESULTS" ] || exit 0
          {
            echo '| Measure | Value | Budget |'
            echo '|---|---|---|'
            jq -r '.results[] | "| \(.name) | \(.value) \(.unit) | \(.gate // "none") |"' "$PERF_RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-results
          path: perf.json
          if-no-files-found: ignore
          retention-days: 90

  e2e-full:
    # Builds the app with the test endpoints and runs every E2E spec on Windows, where the real window lives.
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-e2e
      - name: Install tools
        run: npm ci
      - name: Test build of the app
        run: npx tauri build --no-bundle --features test-endpoints -- --profile ci
      - name: msedgedriver matching the WebView2 Runtime
        run: pwsh tests/e2e/scripts/edgedriver.ps1
      - name: tauri-driver
        run: pwsh tests/e2e/scripts/tauri-driver.ps1
      - name: Every E2E spec
        env:
          OPENNOTE_E2E_EXE: target/ci/opennote.exe
        # One file at a time, because the specs share the machine's windows (tests/e2e/harness.ts). The specs in
        # tests/e2e/later cover Phases 6 to 13: export a PDF, import a notebook, record then stop, search, back up
        # now, quick capture, and the tool windows.
        # Each spec file runs in a process of its own, and any app or driver it left behind is stopped before the
        # next one starts, so one spec that dies cannot reset the connections of the 70 after it.
        run: |
          $failed = @()
          foreach ($spec in Get-ChildItem tests/e2e -Recurse -Filter '*.spec.ts' | Sort-Object FullName) {
            node --test --test-concurrency=1 --test-timeout=600000 $spec.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $spec.Name }
            Get-Process -Name opennote, msedgedriver, tauri-driver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if ($failed.Count -gt 0) {
            "Failed specs: $($failed -join ', ')" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
      - name: Start-up baseline for main
        run: node tests/perf/startup.ts --runs 20 --exe target/ci/opennote.exe --record
      - name: Keep the E2E logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-e2e-logs
          path: tests/e2e/logs
          if-no-files-found: ignore
          retention-days: 14

  soak:
    # A scripted person edits one long note at random for two hours and the job holds memory, nodes, and typing
    # time flat from the first quarter to the last (A4-35, tests/soak). The seed is the run number, so a failure
    # can be replayed with OPENNOTE_SOAK_SEED.
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: read
    env:
      OPENNOTE_SOAK_MINUTES: ${{ inputs.soak_minutes || '120' }}
      OPENNOTE_SOAK_SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      - name: Edit at random for ${{ inputs.soak_minutes || '120' }} minutes
        run: |
          if ! [[ "$OPENNOTE_SOAK_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::soak_minutes must be a whole number."
            exit 1
          fi
          npm run soak
      - name: Show the samples
        if: always()
        run: node tests/soak/summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-results
          path: tests/soak/results/soak.json
          if-no-files-found: ignore
          retention-days: 90

  nvda:
    # NVDA, driven by Guidepup, walks through the checklist for the keyboard and the screen reader in tests/nvda in a headed browser and
    # records what it said (A4-42). The Guidepup packages are installed here, under tests/nvda, not in package.json, so no other job
    # needs them. A phrase NVDA did not say fails the job, and nvda.json has everything it did say.
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      - name: Install Guidepup
        # Into tests/nvda/node_modules, away from the repository's own tree: installing on top of it failed with
        # "Cannot read properties of null (reading 'edgesOut')". The spec still finds the package from there.
        run: npm install --prefix tests/nvda --no-save --no-package-lock --no-audit --no-fund @guidepup/guidepup@0.35.0
      - name: Set up NVDA
        run: npx --yes @guidepup/setup@0.29.1 setup --ci
      - name: Walk the checklist with NVDA
        env:
          OPENNOTE_NVDA: '1'
        run: npm run nvda
      - name: Show the results
        if: always()
        shell: bash
        run: '[ -f tests/nvda/results/nvda.md ] && cat tests/nvda/results/nvda.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nvda-results
          path: tests/nvda/results/nvda.*
          if-no-files-found: ignore
          retention-days: 90

  bundles:
    # The full macOS dmg and Linux AppImage every night (ADR 0055), unsigned, so a packaging problem shows the day it
    # lands and not on release day. The release workflow builds the same bundles from a clean start.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: dmg
            file: OpenNote_macOS.dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust: x86_64-unknown-linux-gnu
            bundle: appimage
            file: OpenNote_Linux.AppImage
    runs-on: ${{ matrix.os }}
    # About 25 minutes for the dmg, whose two architectures build one after the other, with a warm cache.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      OPENNOTE_DRY_RUN: '1'
      BUNDLE_TARGET: ${{ matrix.target }}
      BUNDLE_KIND: ${{ matrix.bundle }}
      BUNDLE_FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-bundles
      - name: WebKitGTK and the other system libraries the app links (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/install-build-deps.sh
      - name: Install tools
        run: npm ci
      - name: Build ${{ matrix.file }}
        run: npx tauri build --target "$BUNDLE_TARGET" --bundles "$BUNDLE_KIND" --ci
      - name: Collect ${{ matrix.file }}
        run: node app/scripts/release/collect-bundle.ts "$BUNDLE_TARGET" "$BUNDLE_FILE" dist-nightly
      - name: Keep ${{ matrix.file }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-${{ matrix.bundle }}
          path: dist-nightly/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7

  report:
    # Opens an issue when any job failed, or adds a comment to the issue that is already open. It is the only
    # job that can write, it can only write issues, and it never checks out the code.
    needs: [plan, fuzz, kill, proptest, perf, e2e-full, bundles, soak, nvda]
    if: ${{ always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAN_RESULT: ${{ needs.plan.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          KILL_RESULT: ${{ needs.kill.result }}
          PROPTEST_RESULT: ${{ needs.proptest.result }}
          PERF_RESULT: ${{ needs.perf.result }}
          E2E_RESULT: ${{ needs.e2e-full.result }}
          BUNDLES_RESULT: ${{ needs.bundles.result }}
          SOAK_RESULT: ${{ needs.soak.result }}
          NVDA_RESULT: ${{ needs.nvda.result }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "The nightly tests failed on $(date -u +%F). Failed jobs:"
            echo
            [ "$PLAN_RESULT" = failure ] && echo "- Listing the fuzz targets"
            [ "$FUZZ_RESULT" = failure ] && echo "- Fuzzing: a crashing input is in the run's artifacts"
            [ "$KILL_RESULT" = failure ] && echo "- Crash safety: replay with seed $GITHUB_RUN_ID"
            [ "$PROPTEST_RESULT" = failure ] && echo "- Property tests: the log has the failing case"
            [ "$PERF_RESULT" = failure ] && echo "- Performance: the results are in the run's artifacts"
            [ "$E2E_RESULT" = failure ] && echo "- E2E specs: the logs are in the run's artifacts"
            [ "$BUNDLES_RESULT" = failure ] && echo "- The macOS dmg or the Linux AppImage didn't build"
            # checks-disable-next-line length: one shell line that writes one line of the run summary
            [ "$SOAK_RESULT" = failure ] && echo "- Random-editing soak: the samples are in the run's artifacts; replay with the run number as the seed"
            [ "$NVDA_RESULT" = failure ] && echo "- NVDA checklist: the spoken log is in the run's artifacts"
            echo
            echo "Run: $run_url"
            echo
            echo "See docs/HARDENING.md for how to reproduce each failure."
          } > body.md
          gh label create nightly-failure --color B60205 --description "A nightly test run failed" --force
          number=$(gh issue list --label nightly-failure --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "The nightly tests are failing" --label nightly-failure --body-file body.md
          fi
