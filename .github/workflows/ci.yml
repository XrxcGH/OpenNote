name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these same checks on the tagged commit. A called workflow sees the
  # caller's event, so a release run is a push here and runs CHECKS on all files.
  workflow_call:

# Every action is pinned to a full commit SHA, with the version in a comment. The release workflow runs these jobs
# in the same run as its build and signing, so they could upload artifacts to it. workflow.test.ts checks the pins.
#
# Every job only reads the repository. A called workflow can narrow the caller's permissions but never widen
# them, so the release workflow's own read-only grant for this call still works. Uploading the debug build
# as a run artifact uses the runner's own token, not GITHUB_TOKEN, so no job needs more than this.
permissions:
  contents: read

jobs:
  checks:
    # Quality gate and TypeScript checks on both operating systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Ubuntu takes 3 to 6 minutes. Windows takes about twice that on a pull request that changes most of the files
    # (about 4 minutes of unit tests, then the changed-file checks). A run that passes its limit is stuck.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      # The PDF tests print Japanese words and check every character reaches the PDF's text layer. Windows has a
      # Japanese font; Ubuntu runners have none, so Chrome draws empty boxes that carry no text.
      - name: Install a Japanese font (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk
      - name: Design tokens are up to date
        run: npm run tokens:check
      - name: Type-check, lint, and format-check
        run: npm run typecheck && npm run lint && npm run format:check
      - name: Unit tests
        run: npm test
      # CHECKS measures text in SVG drawings with the fonts of the runner, and macOS has other fonts, so text that fits
      # on Windows and Ubuntu overlaps there. macOS runs the type-check, lint, and unit tests only.
      - name: CHECKS on changed files (pull requests)
        if: github.event_name == 'pull_request' && runner.os != 'macOS'
        run: node checks/cli.ts --base origin/${{ github.base_ref }}
      - name: CHECKS on all files (pushes and release dry runs)
        if: github.event_name != 'pull_request' && runner.os != 'macOS'
        run: node checks/cli.ts --all

  components:
    # Component tests in a real browser: the installed Edge on Windows, Google Chrome on Ubuntu (tests/browser.ts).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Normally under 4 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      - name: Component tests (Vitest browser mode)
        # In three runs, each with a fresh browser: on Ubuntu one browser session that runs all 159 files was closed by
        # the runner about three minutes in, with a different file running each time.
        shell: bash
        run: |
          status=0
          for shard in 1 2 3; do npm run test:components -- --shard=$shard/3 || status=1; done
          exit $status
      - name: Keep the failure screenshots
        # Vitest saves a screenshot of the page for each failed test.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: component-failures-${{ matrix.os }}
          path: app/.vitest/attachments
          retention-days: 7
          if-no-files-found: ignore

  ui-web-shard:
    # The production interface in Edge: the bundle budget (shard 1 only), then one quarter of the Playwright suite
    # against the test build. The suite is 1400 tests (about 380 screenshots and 450 axe checks): about 90 minutes
    # on one two-core runner, so it runs as four shards of about 25 minutes. The "ui-web" job below gathers them.
    name: ui-web shard ${{ matrix.shard }}/4
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      # Builds main with this branch's tools, so the summary shows each group's change without needing artifacts.
      - name: Build main's interface, to compare bundle sizes with
        if: matrix.shard == 1 && github.event_name == 'pull_request'
        continue-on-error: true
        shell: pwsh
        run: |
          git fetch --depth=1 origin main
          git worktree add ../opennote-main FETCH_HEAD
          New-Item -ItemType Junction -Path ../opennote-main/node_modules -Target (Resolve-Path node_modules) | Out-Null
          Push-Location ../opennote-main
          node app/scripts/build-tokens.ts
          npx vite build --config app/vite.config.ts --manifest
          Pop-Location
          $env:GITHUB_STEP_SUMMARY = ''
          node app/scripts/check-bundle.ts --dist ../opennote-main/app/dist --report bundle-main.json
      - name: Build the production interface
        if: matrix.shard == 1
        run: npm run app:build
      - name: Bundle budget
        if: matrix.shard == 1
        run: node app/scripts/check-bundle.ts --compare-with bundle-main.json
      - name: Build the test interface (web platform)
        run: npm run app:build:test
      - name: Playwright
        # The blob reporter keeps what the merge job needs to build one report from the four shards.
        run: npx playwright test --config tests/ui/playwright.config.ts --shard=${{ matrix.shard }}/4 --reporter=list,github,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
      - name: Keep this shard's report data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ matrix.shard }}
          path: tests/ui/results
          retention-days: 7
          if-no-files-found: ignore

  ui-web:
    # The one name branch protection can require: it passes only when every shard passed, and merges their reports.
    needs: ui-web-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: playwright-blob-*
          path: all-blobs
          merge-multiple: true
        continue-on-error: true
      - name: Merge the shards' reports
        continue-on-error: true
        run: npx playwright merge-reports --config tests/ui/playwright.config.ts --reporter=html all-blobs
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: tests/ui/report
          PLAYWRIGHT_HTML_OPEN: never
      - name: Keep the Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: tests/ui/report
          retention-days: 7
          if-no-files-found: ignore
      - name: Fail unless every shard passed
        if: needs.ui-web-shard.result != 'success'
        run: |
          echo "ui-web shards: ${{ needs.ui-web-shard.result }}"
          exit 1

  layout-audit:
    # The whole app at three window sizes, in both themes and densities, checked for clipped text, overlap, covered scroll
    # bars, and dead space (tests/ui/audit). Findings must match tests/ui/audit/known.json, in both directions. CI runs the
    # three cells that between them hold every size, theme, and density; `npm run audit:layout` runs all 12.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      - name: Layout audit
        run: npm run audit:layout
      - name: Keep the findings
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layout-audit
          path: tests/ui/audit/out
          retention-days: 7

  perf-typing:
    # Phase 4's typing benchmark, in-page measure only (ARCHITECTURE.md section 24.5): every typing condition and
    # the motion gestures, recorded as an artifact. Hosted runners are too noisy for the 16 ms gate itself, which
    # the reference laptop's run checks with OPENNOTE_TYPING_GATE=1 (docs/perf/phase-4.md).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      - name: Typing benchmark
        run: npm run perf:typing
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-typing
          path: tests/perf/typing/results
          retention-days: 30

  native-engines:
    # whisper.cpp, ONNX Runtime, and the language model program need CMake, a C++ compiler, and libclang, so the other
    # jobs leave them out. This one builds and tests them on Windows, where the release builds them.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo clippy -p opennote-intel-engines --all-targets --features whisper-cpp,onnx -- -D warnings
          cargo clippy -p opennote-llm --all-targets --features llama -- -D warnings
      - name: Tests
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo test -p opennote-intel-engines --features whisper-cpp,onnx
          cargo test -p opennote-llm --features llama

  windows-app:
    # Rust checks and a test build of the desktop app on Windows, the first target platform.
    runs-on: windows-latest
    # About 11 minutes with a warm cache. The cache is saved only by a green run, so while the branch is red every run
    # starts cold, and the build with the app's whole dependency tree then takes over 35 minutes on a 4-core runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tools
        run: npm ci
      - name: Build the interface (the Rust app embeds it)
        run: npm run app:build
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy ratchet (no new unwrap, expect, or panic in shipped code)
        # Existing uses are counted per file in checks/data/clippy-ratchet.json. A count may go down, never up.
        run: node checks/clippy-ratchet.ts
      - name: Fetch every platform's crates (the no-network test reads all of them offline)
        run: cargo fetch --locked
      - name: Rust tests
        run: cargo test --workspace
      - name: The notes contract suite against the app's notes bridge and the core
        # The suite runs the notes harness example over stdin and stdout.
        shell: bash
        run: |
          cargo build -p opennote --example notes_harness
          export OPENNOTE_NOTES_HARNESS="$PWD/target/debug/examples/notes_harness.exe"
          npx vitest run --config app/vitest.config.ts --project unit app/src/services/notes/core
      - name: Core lints and tests with every feature
        run: |
          cargo clippy -p opennote-core --all-targets --all-features -- -D warnings
          cargo test -p opennote-core --all-features
      - name: Inter-process types match the Rust ones (bindings drift check)
        # Catches new files too, which git diff alone would miss.
        shell: bash
        run: |
          git status --porcelain app/src/platform/bindings
          test -z "$(git status --porcelain app/src/platform/bindings)"
      - name: Test build of the app (ci profile, with the test endpoints the E2E tests use)
        run: npx tauri build --no-bundle --features test-endpoints -- --profile ci
      - name: Keep the test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opennote-e2e-exe
          path: target/ci/opennote.exe
          retention-days: 7

  e2e-smoke:
    # The E2E smoke set on the real app, driven by WebdriverIO through tauri-driver and msedgedriver.
    needs: windows-app
    runs-on: windows-latest
    # Normally about 10 minutes, most of it installing tauri-driver on a cold cache. Without a limit, a hung
    # session holds the runner for GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Install tools
        run: npm ci
      - name: Cache tauri-driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-${{ runner.os }}-${{ runner.arch }}
      - name: Cache msedgedriver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tests/e2e/.drivers
          key: msedgedriver-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: msedgedriver-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opennote-e2e-exe
          path: target/e2e
      - name: msedgedriver matching the WebView2 Runtime
        run: pwsh tests/e2e/scripts/edgedriver.ps1
      - name: tauri-driver
        run: pwsh tests/e2e/scripts/tauri-driver.ps1
      - name: The app opens WebView2's debugging port, which the E2E specs need
        timeout-minutes: 3
        env:
          OPENNOTE_E2E_EXE: target/e2e/opennote.exe
        run: pwsh tests/e2e/scripts/probe-app.ps1
      - name: E2E smoke set
        # Ends early enough that the next steps, which keep the logs, still run inside the job's limit.
        timeout-minutes: 15
        env:
          OPENNOTE_E2E_EXE: target/e2e/opennote.exe
        run: npm run test:e2e
      - name: Start-up regression check
        run: node tests/perf/startup.ts --runs 5 --exe target/e2e/opennote.exe --compare-with main
      - name: Keep the E2E logs
        # A step that times out is canceled, not failed, and its logs are the ones worth reading.
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: tests/e2e/logs
          retention-days: 7

  desktop-unix:
    # The desktop app on macOS and Linux (ADR 0055): Rust lints and tests for the whole workspace, then a build of
    # the app without a bundle. The release workflow makes the dmg and the AppImage.
    strategy:
      fail-fast: false
      matrix:
        # 22.04 rather than latest: an AppImage runs on systems with this glibc or newer, so the checks build where
        # the release builds.
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    # About 15 minutes with a warm cache. A cold build of the app's whole dependency tree takes about 35.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: WebKitGTK and the other system libraries the app links (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/install-build-deps.sh
      - name: Install tools
        run: npm ci
      - name: Build the interface (the Rust app embeds it)
        run: npm run app:build
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fetch every platform's crates (the no-network test reads all of them offline)
        run: cargo fetch --locked
      - name: Rust tests
        run: cargo test --workspace
      - name: Build of the app, without a bundle
        run: npx tauri build --no-bundle -- --profile ci

  core-linux:
    # The core has no platform UI, so it also runs on Linux, where the Unix file system code is tested.
    runs-on: ubuntu-latest
    # Normally about 10 minutes with a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy for the core, the kill harness, and the benchmarks
        run: >-
          cargo clippy -p opennote-core -p opennote-crashtest -p opennote-perf
          --all-targets --all-features -- -D warnings
      - name: Core tests with every feature
        run: cargo test -p opennote-core --all-features
      - name: Print crate tests, with stand-in lp and lpstat scripts
        run: cargo test -p opennote-print
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - name: Licenses of every crate the build uses
        run: cargo deny check licenses
      - name: Benchmark harness tests
        run: cargo test -p opennote-perf
      - name: Fuzz targets compile
        run: |
          cargo check --manifest-path crates/core/fuzz/Cargo.toml
          cargo check --manifest-path crates/interop/fuzz/Cargo.toml
      - name: No work package stubs are left (pull requests into main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if grep -rn 'unimplemented!("WP' crates/core; then
            echo "Remove every work package stub before Phase 3 merges into main."
            exit 1
          fi

  latex-export:
    # The LaTeX exports are compiled with real TeX engines, so a change to the preamble or the writer that breaks a
    # document fails here and not on a reader's machine (ADR 0054).
    runs-on: ubuntu-latest
    # Normally about 6 minutes with a cold cache: 2 for the TeX packages, 3 for the Rust test build, 1 to compile.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install a small TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-luatex texlive-latex-recommended texlive-latex-extra texlive-plain-generic \
            texlive-fonts-recommended texlive-science lmodern fonts-lmodern poppler-utils
      - name: Write the export fixtures
        env:
          OPENNOTE_LATEX_FIXTURES: ${{ runner.temp }}/latex
        run: |
          mkdir -p "$OPENNOTE_LATEX_FIXTURES"
          cargo test -p opennote-interop --test export_latex_fixtures
      - name: Check that every math command the exporter allows exists in each engine
        # A command that the allowlist names but an engine lacks (unicode-math has no \square, for one) would stop the
        # compile at the equation that uses it. All the missing names are listed in one run.
        working-directory: ${{ runner.temp }}/latex
        run: |
          set -uo pipefail
          src="$GITHUB_WORKSPACE/crates/interop/src/export/latex/math.rs"
          names=$(sed -n '/^const MATH:/,/^];/p' "$src" | grep -o '"[A-Za-z]*"' | tr -d '"')
          [ -n "$names" ] || { echo "No math names found in math.rs."; exit 1; }
          mkdir -p math-names
          missing=0
          for pair in xelatex:unicode lualatex:unicode pdflatex:pdflatex; do
            engine=${pair%%:*}
            main=$(ls "${pair##*:}"/*.tex | head -n 1)
            file="math-names/names-$engine.tex"
            {
              sed '/\\begin{document}/,$d' "$main"
              echo '\begin{document}'
              for n in $names; do
                printf '\\ifdefined\\%s\\else\\typeout{UNDEFINED-NAME %s}\\fi\n' "$n" "$n"
              done
              echo '\end{document}'
            } > "$file"
            (cd math-names && "$engine" -interaction=nonstopmode "names-$engine.tex" > /dev/null || true)
            found=$(grep -h "^UNDEFINED-NAME" "math-names/names-$engine.log" | sort -u || true)
            if [ -n "$found" ]; then
              echo "$engine lacks: $(echo "$found" | cut -d' ' -f2 | tr '\n' ' ')"
              missing=1
            fi
          done
          exit $missing
      - name: Compile them with XeLaTeX, LuaLaTeX, and pdfLaTeX
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/latex
        run: |
          set -euo pipefail
          # No run may end in an error or leave a reference or a citation undefined.
          run() {
            "$@" -interaction=nonstopmode -halt-on-error "$file"
          }
          clean() {
            if grep -E "undefined references|Citation .* undefined|Reference .* undefined" "$name.log"; then
              echo "A reference was left undefined in $dir."
              exit 1
            fi
          }
          for dir in unicode notebook bare; do
            (
              cd "$dir"
              file=$(ls ./*.tex | head -n 1 | sed 's|^\./||')
              name=${file%.tex}
              run xelatex
              if [ -f references.bib ]; then bibtex "$name"; fi
              run xelatex
              run xelatex
              clean
              run lualatex
              run lualatex
              run lualatex
              clean
            )
          done
          (
            cd pdflatex
            dir=pdflatex
            file=$(ls ./*.tex | head -n 1 | sed 's|^\./||')
            name=${file%.tex}
            run pdflatex
            run pdflatex
            clean
          )
      - name: Check that hostile math reads no file
        if: ${{ !cancelled() }}
        # "hostile" is an export of a page whose equations try to read a canary file.
        # The exporter must write them as text, so it compiles like any other and the canary text appears nowhere.
        # "hostile-raw" holds the same equations in a hand-written document, as an engine would meet them
        # if the exporter missed one. It is compiled with shell escape off and file access restricted
        # to the folder (openin_any=p), where the canary, one folder up, must stay unread.
        # Errors in that document are expected and ignored.
        # LuaLaTeX cannot start with file access restricted (luaotfload reads its font data from outside the folder),
        # so it compiles only the export, with no restriction. Its canary checks still hold.
        working-directory: ${{ runner.temp }}/latex
        run: |
          set -uo pipefail
          canary=$(cat canary-secret.txt)
          for engine in xelatex lualatex pdflatex; do
            if [ "$engine" = lualatex ]; then
              unset openin_any openout_any
            else
              export openin_any=p openout_any=p
            fi
            (
              cd hostile
              file=$(ls ./*.tex | head -n 1 | sed 's|^\./||')
              "$engine" -no-shell-escape -interaction=nonstopmode -halt-on-error "$file"
            ) || { echo "The hostile export did not compile with $engine."; exit 1; }
            if [ "$engine" != lualatex ]; then
              (cd hostile-raw && "$engine" -no-shell-escape -interaction=nonstopmode main.tex || true)
            fi
            for pdf in hostile/*.pdf hostile-raw/main.pdf; do
              [ -f "$pdf" ] || continue
              if pdftotext "$pdf" - | grep -F "$canary"; then
                echo "$pdf shows the canary after $engine: a file was read."
                exit 1
              fi
            done
            if grep -F "$canary" hostile/*.log hostile-raw/*.log; then
              echo "A log shows the canary after $engine: a file was read."
              exit 1
            fi
            if grep -E "^\((\.\./|/).*canary-secret" hostile/*.log hostile-raw/*.log; then
              echo "A log shows the canary file being opened after $engine."
              exit 1
            fi
          done

  format-fixtures:
    # Every implementation of the note format reads the same fixtures in docs/format/fixtures.
    runs-on: ubuntu-latest
    # Normally about 5 minutes with a cold cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tools
        run: npm ci
      - name: Rust fixture tests
        run: cargo test -p opennote-core --all-features fixture
      - name: TypeScript fixture tests
        run: npx vitest run --config app/vite.config.ts --passWithNoTests src/core/

  reference-reader:
    # The Python reference reader proves that the specification is enough to read a notebook.
    runs-on: ubuntu-latest
    # Normally under 1 minute.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Reference reader tests
        run: python -m unittest discover -s docs/format/tools -p "test_*.py" -v
