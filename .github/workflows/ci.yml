name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these same checks on the tagged commit. A called workflow sees the
  # caller's event, so a release run is a push here and runs CHECKS on all files.
  workflow_call:

# Every job only reads the repository. A called workflow can narrow the caller's permissions but never widen
# them, so the release workflow's own read-only grant for this call still works. Uploading the debug build
# as a run artifact uses the runner's own token, not GITHUB_TOKEN, so no job needs more than this.
permissions:
  contents: read

jobs:
  checks:
    # Quality gate and TypeScript checks on both operating systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install tools
        run: npm ci
      - name: Design tokens are up to date
        run: npm run tokens:check
      - name: Type-check, lint, and format-check
        run: npm run typecheck && npm run lint && npm run format:check
      - name: Unit tests
        run: npm test
      - name: CHECKS on changed files (pull requests)
        if: github.event_name == 'pull_request'
        run: node checks/cli.ts --base origin/${{ github.base_ref }}
      - name: CHECKS on all files (pushes)
        if: github.event_name == 'push'
        run: node checks/cli.ts --all

  windows-app:
    # Rust checks and a debug build of the desktop app on Windows, the first target platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: npm ci
      - name: Build the interface (the Rust app embeds it)
        run: npm run app:build
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Core lints and tests with every feature
        run: |
          cargo clippy -p opennote-core --all-targets --all-features -- -D warnings
          cargo test -p opennote-core --all-features
      - name: Debug build of the app
        run: npx tauri build --debug --no-bundle
      - name: Keep the debug build
        uses: actions/upload-artifact@v4
        with:
          name: opennote-debug-exe
          path: target/debug/opennote.exe
          retention-days: 7

  core-linux:
    # The core has no platform UI, so it also runs on Linux, where the Unix file system code is tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy for the core, the kill harness, and the benchmarks
        run: >-
          cargo clippy -p opennote-core -p opennote-crashtest -p opennote-perf
          --all-targets --all-features -- -D warnings
      - name: Core tests with every feature
        run: cargo test -p opennote-core --all-features
      - name: Benchmark harness tests
        run: cargo test -p opennote-perf
      - name: Fuzz targets compile
        run: cargo check --manifest-path crates/core/fuzz/Cargo.toml
      - name: No work package stubs are left (pull requests into main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if grep -rn 'unimplemented!("WP' crates/core; then
            echo "Remove every work package stub before Phase 3 merges into main."
            exit 1
          fi

  format-fixtures:
    # Every implementation of the note format reads the same fixtures in docs/format/fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: npm ci
      - name: Rust fixture tests
        run: cargo test -p opennote-core --all-features fixture
      - name: TypeScript fixture tests
        run: npx vitest run --config app/vite.config.ts --passWithNoTests src/core/

  reference-reader:
    # The Python reference reader proves that the specification is enough to read a notebook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Reference reader tests
        run: python -m unittest discover -s docs/format/tools -p "test_*.py" -v
