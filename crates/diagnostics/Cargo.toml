[package]
name = "opennote-diagnostics"
version = "0.1.0"
description = "The self-check and the beta feedback bundle: what OpenNote can tell a person about its own health, with private text removed"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "opennote_diagnostics"

[dependencies]
opennote-core = { path = "../core" }
opennote-crashreport = { path = "../crashreport" }
opennote-updater = { path = "../updater" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# The tests start a real core, which needs its fakes for the event sink.
opennote-core = { path = "../core", features = ["testing"] }
tempfile = "3.27.0"
