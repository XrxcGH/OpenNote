[package]
name = "opennote-llm"
version = "0.1.0"
description = "OpenNote's language model program: llama.cpp in a process of its own, spoken to over standard input and output"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[[bin]]
name = "opennote-llm"
path = "src/main.rs"

[dependencies]
llama-cpp-2 = { version = "0.1.159", default-features = false }
opennote-intel-engines = { path = "../intel-engines" }
serde_json = "1.0.151"
