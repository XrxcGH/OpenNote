[package]
name = "opennote-search"
version = "0.1.0"
description = "OpenNote's search index, saved searches, and link graph: a rebuildable cache over the note files"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "opennote_search"

[dependencies]
opennote-core = { path = "../core" }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[dev-dependencies]
# The testing feature gives the tests an in-memory file system and page generators. It also builds the core the
# way the workspace does, so a lint run of this crate alone sees the same code as CI.
opennote-core = { path = "../core", features = ["testing"] }
proptest = "1.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
