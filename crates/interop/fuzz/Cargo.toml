# Fuzz targets for opennote-interop (A4-36). Run one with `cargo +nightly fuzz run <target>` from
# crates/interop. Each importer target calls an entry function in `opennote_interop::fuzzing`, and the search
# target calls entries/search.rs. tests/fuzz_entries.rs runs the same functions with stable Rust.

[package]
name = "opennote-interop-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
opennote-core = { path = "../../core" }
opennote-interop = { path = "..", features = ["fuzzing"] }
opennote-search = { path = "../../search" }

# Fuzzing needs a nightly toolchain, so this crate is its own workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "zip"
path = "fuzz_targets/zip.rs"
test = false
doc = false
bench = false

