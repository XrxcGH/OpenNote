[package]
name = "opennote-interop"
version = "0.1.0"
description = "OpenNote's import and export: Markdown, HTML, Word, Obsidian, Joplin, and Evernote"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "opennote_interop"

[features]
# Generated notebooks and checks for tests in this crate and others.
testing = []

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
crc32fast = "1.5.2"
encoding_rs = "0.8.42"
flate2 = "1.1.10"
getrandom = "0.3.4"
md-5 = "0.11.0"
opennote-core = { path = "../core" }
pulldown-cmark = { version = "0.13.4", default-features = false }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
zeroize = "1.9.0"

[dev-dependencies]
# The crate's own tests use its testing module.
opennote-interop = { path = ".", features = ["testing"] }
# The tests open imported notebooks with the real core.
opennote-core = { path = "../core", features = ["testing"] }
proptest = "1.11.0"
