[package]
name = "opennote-updater"
version = "0.1.0"
description = "Checks for, verifies, and installs OpenNote updates, and rolls back a version that fails to start"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# Accepts manifests from http://127.0.0.1 and one test key. Only CI's end-to-end builds turn it on, and the
# release build job fails for an exe built with it (ARCHITECTURE.md section 18.12).
test-endpoints = []

[dependencies]
log.workspace = true
minisign-verify = "=0.3.0"
self-replace = "1.5.0"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["native-tls-no-default", "win-system-proxy"] }

[dev-dependencies]
minisign = "0.10.0"
proptest.workspace = true
tempfile.workspace = true
