# Fuzz targets for opennote-core (plan 13.3). Run one with `cargo +nightly fuzz run <target>` from
# crates/core. Each target calls an entry function in `opennote_core::fuzzing`, which an ordinary test also
# runs on the corpus and on past crashes with stable Rust.

[package]
name = "opennote-core-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.13"
opennote-core = { path = "..", features = ["fuzzing"] }

# Fuzzing needs a nightly toolchain, so this crate is its own workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "page_json"
path = "fuzz_targets/page_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "section_json"
path = "fuzz_targets/section_json.rs"
test = false
doc = false
bench = false

