[package]
name = "opennote"
version = "0.1.0"
description = "Open-source note-taking app combining writing, drawing, and recording"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "opennote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
