[package]
name = "opennote"
version = "0.1.0-beta.3"
description = "Open-source note-taking app combining writing, drawing, and recording"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "opennote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# For CI's end-to-end builds only: test update endpoints on 127.0.0.1 and a test key compiled in from
# OPENNOTE_TEST_UPDATE_PUBKEY. The release build job fails for an exe built with it.
test-endpoints = ["opennote-updater/test-endpoints"]

[build-dependencies]
base64 = "0.22.1"
tauri-build = { version = "2", features = [] }

[dependencies]
log.workspace = true
opennote-core = { path = "../../crates/core" }
opennote-crashreport = { path = "../../crates/crashreport" }
opennote-diagnostics = { path = "../../crates/diagnostics" }
opennote-intel = { path = "../../crates/intel" }
opennote-interop = { path = "../../crates/interop" }
# Phase 9: recording to Opus needs libopus, which builds with CMake (preinstalled on the Windows runners).
opennote-media = { path = "../../crates/media", features = ["opus"] }
opennote-search = { path = "../../crates/search" }
opennote-updater = { path = "../../crates/updater" }
notify = "8.2.0"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = [] }
# Web images for paste (Phase 4 ARCHITECTURE.md section 12.2), with the same TLS stack and version as the updater.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
# For `#[implement]`, which the Snap Layouts overlay's UI Automation provider uses.
windows-core = "0.62.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
  "Foundation",
  "Networking_Connectivity",
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
