<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip to OpenNote</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <h1>Clip to OpenNote</h1>

      <form id="pair" hidden>
        <p class="help">
          In OpenNote, open Settings, then App permissions, and choose Pair a browser extension. Type the port and the
          code it shows.
        </p>
        <label for="port">Port</label>
        <input id="port" name="port" inputmode="numeric" autocomplete="off" required />
        <label for="code">Pairing code</label>
        <input id="code" name="code" autocomplete="off" spellcheck="false" required />
        <button type="submit">Pair</button>
      </form>

      <form id="clip" hidden>
        <fieldset>
          <legend>What to clip</legend>
          <label><input type="radio" name="mode" value="article" checked /> Clean article</label>
          <label><input type="radio" name="mode" value="page" /> Full page</label>
          <label><input type="radio" name="mode" value="region" /> Region screenshot</label>
          <label id="mail-choice" hidden><input type="radio" name="mode" value="gmail" /> This email</label>
        </fieldset>
        <label for="title">Title</label>
        <input id="title" name="title" maxlength="200" />
        <label for="section">Section</label>
        <select id="section" name="section" required></select>
        <button type="submit" id="go">Clip</button>
        <button type="button" id="unpair" class="quiet">Forget this pairing</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
