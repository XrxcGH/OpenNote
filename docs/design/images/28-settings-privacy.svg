<rect x="240" y="40" width="1200" height="860" rx="0" fill="#FFFCF6"/>
<rect x="0" y="40" width="240" height="860" rx="0" fill="#F3EEE6"/>
<line x1="240" y1="40" x2="240" y2="900" stroke="#E3DACC"/>
<text x="20" y="70" font-size="13" font-weight="600" fill="#3B6A4D" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">‹ Back to notes</text>
<text x="20" y="110" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">General</text>
<text x="20" y="144" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Appearance</text>
<text x="20" y="178" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Editing</text>
<text x="20" y="212" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Recording</text>
<text x="20" y="246" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">On-device intelligence</text>
<text x="20" y="280" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Storage and backups</text>
<text x="20" y="314" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Updates</text>
<rect x="8" y="328" width="224" height="30" rx="6" fill="#DDE8DA"/>
<text x="20" y="348" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Privacy</text>
<text x="20" y="382" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Windows and power</text>
<text x="20" y="416" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Connectors</text>
<text x="20" y="450" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Help</text>
<text x="20" y="484" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Shortcuts</text>
<text x="20" y="518" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">About</text>
<g pointer-events="none"><rect x="1302" y="0" width="138" height="40" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/></g><g data-fit="4" pointer-events="none"><rect x="1264" y="46" width="135" height="17" rx="8.5" fill="#FFFFFF" stroke="#C2185B" stroke-width="1"/><text x="1270" y="58" font-size="11" font-weight="600" fill="#C2185B" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Window buttons 138×40</text></g>
<text x="288" y="102" font-size="26" font-weight="700" fill="#2B2521" text-anchor="start" font-family="Literata, Cambria, Georgia, serif">Privacy</text>
<rect x="288" y="114" width="48" height="2" rx="0" fill="#A9502F"/>
<text x="288" y="144" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote works on your computer and sends nothing unless you ask it to. This page lists every kind of network use it has.</text>
<text x="288" y="190" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Work offline</text>
<text x="288" y="210" font-size="12" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Blocks everything listed below. Your notes are not affected.</text>
<rect x="1008" y="182" width="40" height="22" rx="11" fill="#877B6C"/><circle cx="1019" cy="193" r="8" fill="#FFFCF6"/>
<text x="288" y="254" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Network use</text>
<text x="288" y="288" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Update checks</text>
<text x="288" y="308" font-size="12" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote asks the update server whether a newer version exists, and downloads it when you all...</text>
<text x="288" y="326" font-size="11" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Has not run yet.</text>
<text x="288" y="364" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Sending a crash report</text>
<text x="288" y="384" font-size="12" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Only when you press Send on a report you have read, and only if an address is set.</text>
<text x="288" y="402" font-size="11" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">No address is set, so a report can only stay on this computer.</text>
<text x="288" y="440" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Model downloads</text>
<text x="288" y="460" font-size="12" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Models for on-device features, only when you choose one.</text>
<text x="288" y="478" font-size="11" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Has not run yet.</text>
<text x="288" y="516" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Saving a web image you paste</text>
<text x="288" y="536" font-size="12" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote can download the picture to keep it in the page.</text>
<text x="288" y="554" font-size="11" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Runs only when you paste, never in the background.</text>
<text x="288" y="610" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Crash reports and checks</text>
<text x="288" y="634" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Crash reports are off. Each saved report can be read before anything is sent.</text>
<g data-fit="6" data-center="both"><rect x="288" y="652" width="150" height="34" rx="8" fill="none" stroke="#877B6C" stroke-width="1"/><text x="363" y="674" font-size="13" font-weight="400" fill="#2B2521" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Check OpenNote</text></g>
<g data-fit="6" data-center="both"><rect x="450" y="652" width="180" height="34" rx="8" fill="none" stroke="#877B6C" stroke-width="1"/><text x="540" y="674" font-size="13" font-weight="400" fill="#2B2521" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Turn on crash reports</text></g>
<g data-fit="4" pointer-events="none"><rect x="1050" y="178" width="233" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1056" y="190" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Work offline blocks every use below at once</text></g>
<g data-fit="4" pointer-events="none"><rect x="1050" y="278" width="200" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1056" y="290" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Each use says what it sends and when</text></g>
<g data-fit="4" pointer-events="none"><rect x="1050" y="640" width="221" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1056" y="652" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Check OpenNote: the self-check, in words</text></g>
<rect x="0" y="900" width="1440" height="44" rx="0" fill="#FFFFFF"/><line x1="0" y1="900" x2="1440" y2="900" stroke="#D9D9D9"/><rect x="16" y="914" width="28" height="16" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/><text x="52" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Keep-out zone: nothing interactive or important goes here</text><rect x="470" y="914" width="28" height="16" rx="0" fill="none" stroke="#6A3FB5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="506" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Layout region with its size in pixels (at 100% scaling)</text><text x="1424" y="927" font-size="12" font-weight="400" fill="#666" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote wireframe · colors from brand/tokens.json</text>
</svg>
