<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 944" width="1440" height="944" role="img">
<title>Crash reports: the consent screen with an example report open</title>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#C2185B" fill-opacity="0.08"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#C2185B" stroke-opacity="0.45" stroke-width="2"/></pattern>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B2521" flood-opacity="0.16"/></filter>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3EEE6"/>
<rect x="0" y="0" width="1440" height="40" rx="0" fill="#F3EEE6"/><rect x="14" y="10" width="16" height="20" rx="3" fill="#FFFCF6" stroke="#2B2521" stroke-width="1.5"/><path d="M17 24c2-6 5-7 6-3s3 4 5-2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#3B6A4D" stroke-width="1.8"/><text x="40" y="25" font-size="13" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote</text><text x="124" y="26" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">←</text><text x="160" y="26" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">→</text><circle cx="196" cy="20" r="4" fill="#2E7048"/><text x="206" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Settings</text><text x="1166" y="25" font-size="12" font-weight="400" fill="#5C534A" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">☁ Saved</text><text x="1198" y="25" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">▦</text><text x="1234" y="25" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">⌕</text><text x="1274" y="25" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">☀</text><text x="1325" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">—</text><text x="1371" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">▢</text><text x="1417" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✕</text>
<rect x="0" y="40" width="1440" height="860" rx="0" fill="#FFFCF6"/>
<rect x="0" y="40" width="1440" height="860" rx="0" fill="#2B252147" fill-opacity="0.55"/>
<rect x="340" y="70" width="760" height="740" rx="14" fill="#FFFDF9" stroke="#E3DACC" stroke-width="1" filter="url(#shadow)"/>
<text x="372" y="122" font-size="22" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Save crash reports on this computer?</text>
<text x="372" y="158" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">If OpenNote stops working, it can save a short report that helps fix the cause.</text>
<text x="372" y="180" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Nothing is saved unless you turn this on.</text>
<text x="372" y="226" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">What a report holds</text>
<text x="372" y="254" font-size="14" font-weight="600" fill="#35704A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✓</text><text x="394" y="254" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Where in the program the crash happened</text>
<text x="372" y="278" font-size="14" font-weight="600" fill="#35704A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✓</text><text x="394" y="278" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">The versions of OpenNote and Windows</text>
<text x="372" y="302" font-size="14" font-weight="600" fill="#35704A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✓</text><text x="394" y="302" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">When it happened</text>
<text x="720" y="226" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">What a report never holds</text>
<text x="720" y="254" font-size="14" font-weight="600" fill="#A8342A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✕</text><text x="742" y="254" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Your notes, page titles, or anything you typed</text>
<text x="720" y="278" font-size="14" font-weight="600" fill="#A8342A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✕</text><text x="742" y="278" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">File, folder, or notebook names</text>
<text x="720" y="302" font-size="14" font-weight="600" fill="#A8342A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✕</text><text x="742" y="302" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Your name or your computer name</text>
<text x="372" y="354" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">A report stays on this computer. You read each one first,</text>
<text x="372" y="376" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">and you choose each time whether to send it.</text>
<text x="372" y="420" font-size="14" font-weight="600" fill="#3B6A4D" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">▾ Hide the example report</text>
<rect x="372" y="436" width="696" height="172" rx="8" fill="#EAE3D8" stroke="#E3DACC" stroke-width="1"/>
<text x="392" y="466" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Mono', 'Cascadia Code', Consolas, monospace">"kind": "exception",</text>
<text x="392" y="492" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Mono', 'Cascadia Code', Consolas, monospace">"app_version": "1.0.0",</text>
<text x="392" y="518" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Mono', 'Cascadia Code', Consolas, monospace">"os": "Windows 10.0.26200 x86_64",</text>
<text x="392" y="544" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Mono', 'Cascadia Code', Consolas, monospace">"exception_code": "0xc0000005",</text>
<text x="392" y="570" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Mono', 'Cascadia Code', Consolas, monospace">"frames": [ { "module": "opennote.exe", "offset": "0x1a2b3c" } ]</text>
<rect x="372" y="642" width="296" height="40" rx="8" fill="#3B6A4D"/><text x="520" y="667" font-size="14" font-weight="600" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Turn on crash reports</text>
<rect x="684" y="642" width="296" height="40" rx="8" fill="none" stroke="#877B6C" stroke-width="1.5"/><text x="832" y="667" font-size="14" font-weight="600" fill="#2B2521" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Keep crash reports off</text>
<text x="372" y="720" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">You can change this at any time in Settings, under Privacy.</text>
<text x="372" y="760" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Escape closes this screen and keeps crash reports off.</text>
<rect x="0" y="900" width="1440" height="44" rx="0" fill="#FFFFFF"/><line x1="0" y1="900" x2="1440" y2="900" stroke="#D9D9D9"/><rect x="16" y="914" width="28" height="16" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/><text x="52" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Keep-out zone: nothing interactive or important goes here</text><rect x="470" y="914" width="28" height="16" rx="0" fill="none" stroke="#6A3FB5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="506" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Layout region with its size in pixels (at 100% scaling)</text><text x="1424" y="927" font-size="12" font-weight="400" fill="#666" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote wireframe · colors from brand/tokens.json</text>
</svg>
