<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 944" width="1440" height="944" role="img">
<title>Check OpenNote: seven checks, each with a status in words</title>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#C2185B" fill-opacity="0.08"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#C2185B" stroke-opacity="0.45" stroke-width="2"/></pattern>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B2521" flood-opacity="0.16"/></filter>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3EEE6"/>
<rect x="0" y="0" width="1440" height="40" rx="0" fill="#F3EEE6"/><rect x="14" y="10" width="16" height="20" rx="3" fill="#FFFCF6" stroke="#2B2521" stroke-width="1.5"/><path d="M17 24c2-6 5-7 6-3s3 4 5-2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#3B6A4D" stroke-width="1.8"/><text x="40" y="25" font-size="13" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote</text><text x="122" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Settings</text><text x="1274" y="25" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">☾</text><text x="1246" y="25" font-size="12" font-weight="400" fill="#5C534A" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✓ Saved</text><text x="1325" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">—</text><text x="1371" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">▢</text><text x="1417" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✕</text>
<rect x="0" y="40" width="1440" height="860" rx="0" fill="#FFFCF6"/>
<rect x="0" y="40" width="1440" height="860" rx="0" fill="#2B252147" fill-opacity="0.55"/>
<rect x="270" y="70" width="900" height="760" rx="14" fill="#FFFDF9" stroke="#E3DACC" stroke-width="1" filter="url(#shadow)"/>
<text x="302" y="122" font-size="22" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Check OpenNote</text>
<text x="302" y="156" font-size="16" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">2 things need attention.</text>
<text x="302" y="180" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Checked Oct 2, 2026 at 2:05 PM.</text>
<rect x="1008" y="140" width="130" height="40" rx="8" fill="none" stroke="#877B6C" stroke-width="1.5"/><text x="1073" y="165" font-size="14" font-weight="600" fill="#2B2521" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Check again</text>
<line x1="302" y1="210" x2="1138" y2="210" stroke="#E3DACC"/>
<circle cx="320" cy="244" r="13" fill="#35704A"/><text x="320" y="249" font-size="14" font-weight="700" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✓</text>
<text x="352" y="238" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Space for your notes</text>
<text x="352" y="260" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">184.2 GB free.</text>
<text x="1138" y="238" font-size="13" font-weight="600" fill="#2B2521" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OK</text>
<line x1="302" y1="280" x2="1138" y2="280" stroke="#E3DACC"/>
<circle cx="320" cy="314" r="13" fill="#855B0C"/><text x="320" y="319" font-size="14" font-weight="700" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">!</text>
<text x="352" y="308" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Space for updates and backups</text>
<text x="352" y="330" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">240 MB free. Free up some space soon, so saves and updates keep working.</text>
<text x="1138" y="308" font-size="13" font-weight="600" fill="#2B2521" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Needs attention</text>
<line x1="302" y1="350" x2="1138" y2="350" stroke="#E3DACC"/>
<circle cx="320" cy="384" r="13" fill="#35704A"/><text x="320" y="389" font-size="14" font-weight="700" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✓</text>
<text x="352" y="378" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Saving in the notebook folder</text>
<text x="352" y="400" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote can save in this folder.</text>
<text x="1138" y="378" font-size="13" font-weight="600" fill="#2B2521" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OK</text>
<line x1="302" y1="420" x2="1138" y2="420" stroke="#E3DACC"/>
<circle cx="320" cy="454" r="13" fill="#855B0C"/><text x="320" y="459" font-size="14" font-weight="700" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">!</text>
<text x="352" y="448" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Where the notebook is stored</text>
<text x="352" y="470" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">The notebook is on a NTFS drive. OneDrive syncs this folder.</text>
<text x="1138" y="448" font-size="13" font-weight="600" fill="#2B2521" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Needs attention</text>
<line x1="302" y1="490" x2="1138" y2="490" stroke="#E3DACC"/>
<circle cx="320" cy="524" r="13" fill="#A8342A"/><text x="320" y="529" font-size="14" font-weight="700" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✕</text>
<text x="352" y="518" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">The notebook</text>
<text x="352" y="540" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">2 problems found in 412 files checked.</text>
<text x="1138" y="518" font-size="13" font-weight="600" fill="#2B2521" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Problem</text>
<line x1="302" y1="560" x2="1138" y2="560" stroke="#E3DACC"/>
<circle cx="320" cy="594" r="13" fill="#35704A"/><text x="320" y="599" font-size="14" font-weight="700" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✓</text>
<text x="352" y="588" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Updates</text>
<text x="352" y="610" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Last checked today.</text>
<text x="1138" y="588" font-size="13" font-weight="600" fill="#2B2521" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OK</text>
<line x1="302" y1="630" x2="1138" y2="630" stroke="#E3DACC"/>
<circle cx="320" cy="664" r="13" fill="#35704A"/><text x="320" y="669" font-size="14" font-weight="700" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✓</text>
<text x="352" y="658" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Crash reports</text>
<text x="352" y="680" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">No crash reports are saved.</text>
<text x="1138" y="658" font-size="13" font-weight="600" fill="#2B2521" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OK</text>
<text x="302" y="786" font-size="13" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">This check changes nothing. Nothing leaves this computer.</text>
<rect x="0" y="900" width="1440" height="44" rx="0" fill="#FFFFFF"/><line x1="0" y1="900" x2="1440" y2="900" stroke="#D9D9D9"/><rect x="16" y="914" width="28" height="16" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/><text x="52" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Keep-out zone: nothing interactive or important goes here</text><rect x="470" y="914" width="28" height="16" rx="0" fill="none" stroke="#6A3FB5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="506" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Layout region with its size in pixels (at 100% scaling)</text><text x="1424" y="927" font-size="12" font-weight="400" fill="#666" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote wireframe · colors from brand/tokens.json</text>
</svg>
