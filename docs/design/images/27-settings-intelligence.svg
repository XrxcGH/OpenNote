<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3EEE6"/>
<rect x="0" y="0" width="1440" height="40" rx="0" fill="#F3EEE6"/><rect x="14" y="10" width="16" height="20" rx="3" fill="#FFFCF6" stroke="#2B2521" stroke-width="1.5"/><path d="M17 24c2-6 5-7 6-3s3 4 5-2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#3B6A4D" stroke-width="1.8"/><text x="40" y="25" font-size="13" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote</text><text x="124" y="26" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">←</text><text x="160" y="26" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">→</text><circle cx="196" cy="20" r="4" fill="#2E7048"/><text x="206" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Settings</text><text x="1166" y="25" font-size="12" font-weight="400" fill="#5C534A" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">☁ Saved</text><text x="1198" y="25" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">▦</text><text x="1234" y="25" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">⌕</text><text x="1274" y="25" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">☀</text><text x="1325" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">—</text><text x="1371" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">▢</text><text x="1417" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✕</text>
<rect x="240" y="40" width="1200" height="860" rx="0" fill="#FFFCF6"/>
<rect x="0" y="40" width="240" height="860" rx="0" fill="#F3EEE6"/>
<line x1="240" y1="40" x2="240" y2="900" stroke="#E3DACC"/>
<text x="20" y="70" font-size="13" font-weight="600" fill="#3B6A4D" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">‹ Back to notes</text>
<text x="20" y="110" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">General</text>
<text x="20" y="144" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Appearance</text>
<text x="20" y="178" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Editing</text>
<text x="20" y="212" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Recording</text>
<rect x="8" y="226" width="224" height="30" rx="6" fill="#DDE8DA"/>
<text x="20" y="246" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">On-device intelligence</text>
<text x="20" y="280" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Storage and backups</text>
<text x="20" y="314" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Updates</text>
<text x="20" y="348" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Privacy</text>
<text x="20" y="382" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Windows and power</text>
<text x="20" y="416" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Connectors</text>
<text x="20" y="450" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Help</text>
<text x="20" y="484" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Shortcuts</text>
<text x="20" y="518" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">About</text>
<g pointer-events="none"><rect x="1302" y="0" width="138" height="40" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/></g><g data-fit="4" pointer-events="none"><rect x="1264" y="46" width="135" height="17" rx="8.5" fill="#FFFFFF" stroke="#C2185B" stroke-width="1"/><text x="1270" y="58" font-size="11" font-weight="600" fill="#C2185B" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Window buttons 138×40</text></g>
<text x="288" y="102" font-size="26" font-weight="700" fill="#2B2521" text-anchor="start" font-family="Literata, Cambria, Georgia, serif">On-device intelligence</text>
<rect x="288" y="114" width="48" height="2" rx="0" fill="#A9502F"/>
<text x="288" y="144" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">These features read your notes on this computer. Nothing is sent anywhere. Each one stays off until you turn it on.</text>
<rect x="288" y="170" width="760" height="80" rx="10" fill="#FFFDF9" stroke="#E3DACC" stroke-width="1"/>
<text x="308" y="196" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Text in images</text><text x="308" y="216" font-size="12" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Finds words in pictures and screenshots, so you can copy and search them.</text><rect x="988" y="184" width="40" height="22" rx="11" fill="#877B6C"/><circle cx="999" cy="195" r="8" fill="#FFFCF6"/>
<text x="308" y="234" font-size="11" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Off · Runs on this device. Nothing leaves it.</text>
<rect x="288" y="262" width="760" height="80" rx="10" fill="#FFFDF9" stroke="#E3DACC" stroke-width="1"/>
<text x="308" y="288" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Handwriting</text><text x="308" y="308" font-size="12" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Turns handwriting into text you can copy and search, using Windows recognition.</text><rect x="988" y="276" width="40" height="22" rx="11" fill="#877B6C"/><circle cx="999" cy="287" r="8" fill="#FFFCF6"/>
<text x="308" y="326" font-size="11" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Off · Runs on this device. Nothing leaves it.</text>
<rect x="288" y="354" width="760" height="80" rx="10" fill="#FFFDF9" stroke="#E3DACC" stroke-width="1"/>
<text x="308" y="380" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Read aloud</text><text x="308" y="400" font-size="12" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Reads a page in a voice installed on Windows, highlighting each word.</text><rect x="988" y="368" width="40" height="22" rx="11" fill="#877B6C"/><circle cx="999" cy="379" r="8" fill="#FFFCF6"/>
<text x="308" y="418" font-size="11" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Off · Runs on this device. Nothing leaves it.</text>
<rect x="288" y="446" width="760" height="80" rx="10" fill="#FFFDF9" stroke="#E3DACC" stroke-width="1"/>
<text x="308" y="472" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Summaries and keywords</text><text x="308" y="492" font-size="12" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Picks the sentences and keywords that best stand for a page. It writes nothing new.</text><rect x="988" y="460" width="40" height="22" rx="11" fill="#877B6C"/><circle cx="999" cy="471" r="8" fill="#FFFCF6"/>
<text x="308" y="510" font-size="11" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Off · Runs on this device. Nothing leaves it.</text>
<text x="288" y="570" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Models</text>
<text x="288" y="594" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Some features need a model, a file that is downloaded once and then used on this device.</text>
<text x="288" y="614" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">You choose which. The size is shown first, and nothing downloads until you choose it.</text>
<text x="288" y="654" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Speech to text</text>
<text x="288" y="678" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Turn a recording into a transcript. Choose one model.</text>
<g data-fit="4" pointer-events="none"><rect x="1050" y="168" width="125" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1056" y="180" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Every feature starts off</text></g>
<g data-fit="4" pointer-events="none"><rect x="1050" y="194" width="132" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1056" y="206" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Each runs on this device</text></g>
<g data-fit="4" pointer-events="none"><rect x="1050" y="220" width="142" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1056" y="232" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">A choice survives a restart</text></g>
<g data-fit="4" pointer-events="none"><rect x="1050" y="246" width="174" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1056" y="258" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Status: on and ready, or why not</text></g>
<rect x="0" y="900" width="1440" height="44" rx="0" fill="#FFFFFF"/><line x1="0" y1="900" x2="1440" y2="900" stroke="#D9D9D9"/><rect x="16" y="914" width="28" height="16" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/><text x="52" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Keep-out zone: nothing interactive or important goes here</text><rect x="470" y="914" width="28" height="16" rx="0" fill="none" stroke="#6A3FB5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="506" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Layout region with its size in pixels (at 100% scaling)</text><text x="1424" y="927" font-size="12" font-weight="400" fill="#666" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote wireframe · colors from brand/tokens.json</text>
</svg>
