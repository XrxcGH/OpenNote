<circle cx="744" cy="170" r="5" fill="#3B6A4D"/>
<circle cx="768" cy="170" r="5" fill="#E3DACC"/>
<text x="720" y="200" font-size="13" font-weight="400" fill="#6B6054" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Step 4 of 5</text>
<text x="720" y="246" font-size="30" font-weight="600" fill="#2B2521" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Smart features</text>
<text x="720" y="276" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Everything runs on this device. Nothing leaves it.</text>
<rect x="394" y="310" width="652" height="84" rx="10" fill="#FFFCF6" stroke="#3B6A4D" stroke-width="3"/>
<circle cx="417" cy="339" r="9" fill="none" stroke="#3B6A4D" stroke-width="2"/>
<circle cx="417" cy="339" r="5" fill="#3B6A4D"/>
<text x="436" y="344" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Recommended</text>
<text x="436" y="364" font-size="12" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Transcription, handwriting, text in images, and summaries. About 600 MB.</text>
<rect x="394" y="410" width="652" height="84" rx="10" fill="#FFFCF6" stroke="#E3DACC" stroke-width="1"/>
<circle cx="417" cy="439" r="9" fill="none" stroke="#877B6C" stroke-width="2"/>
<text x="436" y="444" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Custom</text>
<text x="436" y="464" font-size="12" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Choose each feature, and a local model or your own cloud key.</text>
<rect x="394" y="510" width="652" height="84" rx="10" fill="#FFFCF6" stroke="#E3DACC" stroke-width="1"/>
<circle cx="417" cy="539" r="9" fill="none" stroke="#877B6C" stroke-width="2"/>
<text x="436" y="544" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Not now</text>
<text x="436" y="564" font-size="12" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Everything stays off. Turn features on later in Settings.</text>
<text x="408" y="630" font-size="13" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Models download in the background. You can start taking notes right away.</text>
<text x="408" y="684" font-size="15" font-weight="600" fill="#3B6A4D" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Back</text>
<rect x="894" y="658" width="150" height="40" rx="8" fill="#3B6A4D"/>
<text x="969" y="684" font-size="15" font-weight="600" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Continue</text>
<rect x="388" y="304" width="664" height="296" rx="0" fill="none" stroke="#6A3FB5" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="1096" y="318" width="301" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1102" y="330" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Option cards 652×84, whole card clickable</text>
<rect x="1096" y="342" width="231" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1102" y="354" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Sizes shown before any download</text>
<rect x="1302" y="0" width="138" height="40" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/><rect x="1280" y="46" width="161" height="17" rx="8.5" fill="#FFFFFF" stroke="#C2185B" stroke-width="1"/><text x="1286" y="58" font-size="11" font-weight="600" fill="#C2185B" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Window buttons 138×40</text>
<rect x="0" y="900" width="1440" height="44" rx="0" fill="#FFFFFF"/><line x1="0" y1="900" x2="1440" y2="900" stroke="#D9D9D9"/><rect x="16" y="914" width="28" height="16" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/><text x="52" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Keep-out zone: nothing interactive or important goes here</text><rect x="470" y="914" width="28" height="16" rx="0" fill="none" stroke="#6A3FB5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="506" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Layout region with its size in pixels (at 100% scaling)</text><text x="1424" y="927" font-size="12" font-weight="400" fill="#666" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote wireframe · colors from brand/tokens.json</text>
