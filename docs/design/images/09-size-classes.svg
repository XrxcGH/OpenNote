<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 724" width="1440" height="724" role="img">
<title>Layouts for each size class</title>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#C2185B" fill-opacity="0.08"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#C2185B" stroke-opacity="0.45" stroke-width="2"/></pattern>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B2521" flood-opacity="0.16"/></filter>
</defs>
<rect x="0" y="0" width="1440" height="680" rx="0" fill="#FFFCF6"/>
<text x="40" y="44" font-size="15" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Layouts follow the window width, not the device type. Frames are not to scale.</text>
<text x="40" y="80" font-size="20" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Compact</text><text x="40" y="104" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Under 600 px (phones)</text><rect x="40" y="120" width="200" height="400" rx="10" fill="#F3EEE6" stroke="#877B6C" stroke-width="2"/><rect x="40" y="120" width="200" height="22" rx="10" fill="#EAE3D8"/><rect x="46" y="148" width="184" height="366" rx="6" fill="#FFFCF6" stroke="#E3DACC" stroke-width="1"/><text x="138" y="320" font-size="13" font-weight="600" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">One pane</text><text x="40" y="548" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">One pane at a time</text><text x="40" y="568" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Bottom toolbar</text><text x="40" y="588" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Pages open in Reading view</text>
<text x="300" y="80" font-size="20" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Medium</text><text x="300" y="104" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">600 to 839 px</text><rect x="300" y="120" width="320" height="400" rx="10" fill="#F3EEE6" stroke="#877B6C" stroke-width="2"/><rect x="300" y="120" width="320" height="22" rx="10" fill="#EAE3D8"/><rect x="306" y="148" width="119.2" height="366" rx="6" fill="#F3EEE6" stroke="#E3DACC" stroke-width="1"/><text x="365.6" y="320" font-size="13" font-weight="600" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Pages</text><rect x="429.2" y="148" width="180.79999999999998" height="366" rx="6" fill="#FFFCF6" stroke="#E3DACC" stroke-width="1"/><text x="519.6" y="320" font-size="13" font-weight="600" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Page</text><text x="300" y="548" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Page list beside the page</text><text x="300" y="568" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Notebooks in a slide-over drawer</text>
<text x="680" y="80" font-size="20" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Expanded</text><text x="680" y="104" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">840 to 1,199 px</text><rect x="680" y="120" width="330" height="400" rx="10" fill="#F3EEE6" stroke="#877B6C" stroke-width="2"/><rect x="680" y="120" width="330" height="22" rx="10" fill="#EAE3D8"/><rect x="686" y="148" width="91.39999999999999" height="366" rx="6" fill="#F3EEE6" stroke="#E3DACC" stroke-width="1"/><text x="731.7" y="320" font-size="13" font-weight="600" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Notebooks</text><rect x="781.4" y="148" width="218.6" height="366" rx="6" fill="#FFFCF6" stroke="#E3DACC" stroke-width="1"/><text x="890.6999999999999" y="320" font-size="13" font-weight="600" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Page</text><text x="680" y="548" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Notebooks beside the page</text><text x="680" y="568" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Page list opens as an overlay</text>
<text x="1070" y="80" font-size="20" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Wide</text><text x="1070" y="104" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">1,200 px and up</text><rect x="1070" y="120" width="330" height="400" rx="10" fill="#F3EEE6" stroke="#877B6C" stroke-width="2"/><rect x="1070" y="120" width="330" height="22" rx="10" fill="#EAE3D8"/><rect x="1076" y="148" width="72.32" height="366" rx="6" fill="#F3EEE6" stroke="#E3DACC" stroke-width="1"/><text x="1112.16" y="320" font-size="13" font-weight="600" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Books</text><rect x="1152.32" y="148" width="78.68" height="366" rx="6" fill="#F3EEE6" stroke="#E3DACC" stroke-width="1"/><text x="1191.6599999999999" y="320" font-size="13" font-weight="600" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Pages</text><rect x="1235" y="148" width="155" height="366" rx="6" fill="#FFFCF6" stroke="#E3DACC" stroke-width="1"/><text x="1312.5" y="320" font-size="13" font-weight="600" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Page</text><text x="1070" y="548" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Three panes: 272 + 300 + page</text><text x="1070" y="568" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Every pane resizes and collapses</text>
<g data-fit="4" pointer-events="none"><rect x="40" y="628" width="712" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="46" y="640" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Pen palette, command bar and dialogs adapt with the same breakpoints (docs/BRAND.md section 6)</text></g>
<rect x="0" y="680" width="1440" height="44" rx="0" fill="#FFFFFF"/><line x1="0" y1="680" x2="1440" y2="680" stroke="#D9D9D9"/><rect x="16" y="694" width="28" height="16" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/><text x="52" y="707" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Keep-out zone: nothing interactive or important goes here</text><rect x="470" y="694" width="28" height="16" rx="0" fill="none" stroke="#6A3FB5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="506" y="707" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Layout region with its size in pixels (at 100% scaling)</text><text x="1424" y="707" font-size="12" font-weight="400" fill="#666" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote wireframe · colors from brand/tokens.json</text>
</svg>
