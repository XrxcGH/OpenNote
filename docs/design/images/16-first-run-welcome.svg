<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 944" width="1440" height="944" role="img">
<title>First run, step 1: welcome</title>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#C2185B" fill-opacity="0.08"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#C2185B" stroke-opacity="0.45" stroke-width="2"/></pattern>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B2521" flood-opacity="0.16"/></filter>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3EEE6"/>
<rect x="0" y="0" width="1440" height="40" rx="0" fill="#F3EEE6"/><rect x="14" y="10" width="16" height="20" rx="3" fill="#FFFCF6" stroke="#2B2521" stroke-width="1.5"/><path d="M17 24c2-6 5-7 6-3s3 4 5-2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#3B6A4D" stroke-width="1.8"/><text x="40" y="25" font-size="13" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote</text><text x="1325" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">—</text><text x="1371" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">▢</text><text x="1417" y="25" font-size="13" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">✕</text>
<defs><radialGradient id="ambient11" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 40) scale(1008 688)"><stop offset="0" stop-color="#FFF0D4"/><stop offset="1" stop-color="#FFF0D4" stop-opacity="0"/></radialGradient><radialGradient id="ambient11p"><stop offset="0" stop-color="#FCE4B8"/><stop offset="1" stop-color="#FCE4B8" stop-opacity="0"/></radialGradient></defs><rect x="0" y="40" width="1440" height="860" rx="0" fill="#EAE3D8"/><rect x="0" y="40" width="1440" height="860" fill="url(#ambient11)"/>
<rect x="360" y="114" width="720" height="672" rx="16" fill="#FFFDF9" filter="url(#shadow)"/>
<circle cx="660" cy="154" r="5" fill="#3B6A4D"/>
<circle cx="684" cy="154" r="5" fill="#E3DACC"/>
<circle cx="708" cy="154" r="5" fill="#E3DACC"/>
<circle cx="732" cy="154" r="5" fill="#E3DACC"/>
<circle cx="756" cy="154" r="5" fill="#E3DACC"/>
<circle cx="780" cy="154" r="5" fill="#E3DACC"/>
<text x="720" y="184" font-size="13" font-weight="400" fill="#6B6054" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Step 1 of 6</text>
<text x="720" y="230" font-size="30" font-weight="600" fill="#2B2521" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Welcome to OpenNote</text>
<text x="720" y="260" font-size="15" font-weight="400" fill="#5C534A" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">A notebook for typing, handwriting, and recording. Your notes stay in files you own.</text>
<g transform="translate(540 304) scale(1.5)"><path d="M78 100V44a42 42 0 0 1 84 0v56z" fill="#F8EBD3" stroke="#877B6C" stroke-width="2"/><circle cx="120" cy="66" r="13" fill="#F2CF8A"/><path d="M78 100V84q22-14 42-4t42 0v20z" fill="#C8DCC6"/><line x1="120" y1="6" x2="120" y2="100" stroke="#877B6C"/><line x1="78" y1="62" x2="162" y2="62" stroke="#877B6C"/><path d="M74 100c-8-18 6-26-2-44" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2E7048" stroke-width="2"/><circle cx="70" cy="80" r="3.5" fill="#C8DCC6" stroke="#2E7048" stroke-width="2"/><circle cx="77" cy="58" r="3.5" fill="#C8DCC6" stroke="#2E7048" stroke-width="2"/><line x1="14" y1="128" x2="226" y2="128" stroke="#877B6C"/><rect x="20" y="116" width="50" height="10" rx="0" fill="#EDC3AF" stroke="#877B6C" stroke-width="1"/><rect x="24" y="106" width="42" height="10" rx="0" fill="#EDC0C9" stroke="#877B6C" stroke-width="1"/><rect x="22" y="96" width="44" height="10" rx="0" fill="#C8DCC6" stroke="#877B6C" stroke-width="1"/><path d="M98 128l20-5 20 5v-12l-20-5-20 5z" fill="#F8EBD3" stroke="#877B6C"/><line x1="118" y1="111" x2="118" y2="123" stroke="#877B6C"/><rect x="168" y="100" width="9" height="28" rx="0" fill="#F8EBD3" stroke="#877B6C" stroke-width="1"/><rect x="188" y="112" width="9" height="16" rx="0" fill="#F8EBD3" stroke="#877B6C" stroke-width="1"/><ellipse cx="172.5" cy="94" rx="3" ry="5" fill="#9A5410"/><ellipse cx="192.5" cy="106" rx="3" ry="5" fill="#9A5410"/><path d="M206 128h22l-3 18h-16z" fill="#EDC3AF" stroke="#877B6C"/><path d="M217 128c0-12-2-20-8-28M217 128c1-10 4-16 10-22" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#2E7048" stroke-width="2"/></g>
<text x="720" y="634" font-size="13" font-weight="400" fill="#6B6054" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Setup takes about a minute. You can change every choice later in Settings.</text>
<g data-fit="8" data-center="both">
<rect x="894" y="714" width="150" height="40" rx="8" fill="#3B6A4D"/>
<text x="969" y="740" font-size="15" font-weight="600" fill="#FFFCF6" text-anchor="middle" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Get started</text>
</g>
<g pointer-events="none"><rect x="530" y="298" width="380" height="240" rx="0" fill="none" stroke="#6A3FB5" stroke-width="1.5" stroke-dasharray="6 4"/></g><g data-fit="4" pointer-events="none"><rect x="536" y="302" width="298" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="542" y="314" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Welcome desk 360×225, drawn at 240×150</text></g>
<g data-fit="4" pointer-events="none"><rect x="1096" y="332" width="179" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1102" y="344" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">The desk by the window</text></g>
<g data-fit="4" pointer-events="none"><rect x="1096" y="358" width="209" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1102" y="370" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Drawings never sit on text</text></g>
<g data-fit="4" pointer-events="none"><rect x="1096" y="384" width="246" height="17" rx="8.5" fill="#FFFFFF" stroke="#6A3FB5" stroke-width="1"/><text x="1102" y="396" font-size="11" font-weight="600" fill="#6A3FB5" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Backdrop: only the window light</text></g>
<g pointer-events="none"><rect x="1302" y="0" width="138" height="40" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/></g><g data-fit="4" pointer-events="none"><rect x="1264" y="46" width="172" height="17" rx="8.5" fill="#FFFFFF" stroke="#C2185B" stroke-width="1"/><text x="1270" y="58" font-size="11" font-weight="600" fill="#C2185B" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Window buttons 138×40</text></g>
<rect x="0" y="900" width="1440" height="44" rx="0" fill="#FFFFFF"/><line x1="0" y1="900" x2="1440" y2="900" stroke="#D9D9D9"/><rect x="16" y="914" width="28" height="16" rx="0" fill="url(#hatch)" stroke="#C2185B" stroke-width="1" stroke-dasharray="4 3"/><text x="52" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Keep-out zone: nothing interactive or important goes here</text><rect x="470" y="914" width="28" height="16" rx="0" fill="none" stroke="#6A3FB5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="506" y="927" font-size="12" font-weight="400" fill="#333" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Layout region with its size in pixels (at 100% scaling)</text><text x="1424" y="927" font-size="12" font-weight="400" fill="#666" text-anchor="end" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">OpenNote wireframe · colors from brand/tokens.json</text>
