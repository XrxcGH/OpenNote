" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Quick toggle: ☾ in the title bar, or Ctrl+Shift+D (Change…)</text><text x="288" y="356" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Page color in dark mode</text><circle cx="296" cy="381" r="8" fill="none" stroke="#3B6A4D" stroke-width="2"/><circle cx="296" cy="381" r="4" fill="#3B6A4D"/><text x="312" y="386" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Match the theme (default)</text><circle cx="296" cy="411" r="8" fill="none" stroke="#877B6C" stroke-width="2"/><text x="312" y="416" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Always paper white</text><text x="288" y="466" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Text size</text><rect x="288" y="484" width="360" height="4" rx="2" fill="#E3DACC"/><rect x="288" y="484" width="120" height="4" rx="2" fill="#3B6A4D"/><circle cx="408" cy="486" r="9" fill="#3B6A4D"/><text x="668" y="492" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">100%</text><text x="288" y="540" font-size="15" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Reduce motion</text><text x="288" y="562" font-size="13" font-weight="400" fill="#5C534A" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Follows the Windows animation setting</text><rect x="748" y="534" width="40" height="22" rx="11" fill="#3B6A4D"/><circle cx="777" cy="545" r="8" fill="#FF