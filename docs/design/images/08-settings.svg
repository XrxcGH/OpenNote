tem-ui, sans-serif">Ask before installing</text><circle cx="860" cy="349" r="8" fill="none" stroke="#877B6C" stroke-width="2"/><text x="876" y="354" font-size="14" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Only check when I ask</text><text x="852" y="396" font-size="14" font-weight="600" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Channel</text><rect x="928" y="378" width="120" height="28" rx="6" fill="none" stroke="#877B6C" stroke-width="1"/><text x="940" y="397" font-size="13" font-weight="400" fill="#2B2521" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Stable ▾</text><text x="852" y="442" font-size="13" font-weight="600" fill="#3B6A4D" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Go back to version 0.3.2</text><text x="852" y="484" font-size="13" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">Updates never change your notes or settings.</text><text x="852" y="504" font-size="13" font-weight="400" fill="#6B6054" text-anchor="start" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif">A backup is made before any file conversion.</text>
