[package]
name = "opennote-spikes"
version = "0.0.0"
description = "Phase 1 spikes: throwaway experiments that measure ink, text, PDF export, and audio on Windows"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The spikes measure WebView2 and WASAPI, so they build on Windows only.
# wry and tao are the window and WebView2 layers that Tauri uses, at the versions in Cargo.lock.
[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Performance",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
